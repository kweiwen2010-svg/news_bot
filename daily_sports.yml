import os
import requests
from datetime import datetime
from zoneinfo import ZoneInfo
from dotenv import load_dotenv

load_dotenv()
TW_TZ = ZoneInfo("Asia/Taipei")

TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

# ==========================================
# 通用 ESPN API 賽事抓取工具
# ==========================================
def fetch_espn_league_scores(sport: str, league_code: str, league_name: str, emoji: str) -> str:
    print(f"{emoji} 正在抓取 {league_name} 最新賽果...")
    try:
        url = f"https://site.api.espn.com/apis/site/v2/sports/{sport}/{league_code}/scoreboard"
        resp = requests.get(url, timeout=15)
        data = resp.json()
        
        events = data.get("events", [])
        if not events:
            return f"{emoji} **{league_name}**：今日無排定賽事或休兵日。"

        lines = [f"{emoji} **{league_name} 今日焦點賽果**"]
        for event in events:
            status = event.get("status", {}).get("type", {}).get("shortDetail", "未開打")
            competitors = event.get("competitions", [{}])[0].get("competitors", [])
            
            if len(competitors) == 2:
                home = competitors[0]
                away = competitors[1]
                
                home_name = home.get("team", {}).get("displayName", "")
                home_score = home.get("score", "0")
                away_name = away.get("team", {}).get("displayName", "")
                away_score = away.get("score", "0")
                
                lines.append(f"▸ {away_name} {away_score} vs {home_score} {home_name} [{status}]")
                
        return "\n".join(lines)
    except Exception as e:
        print(f"⚠️ {league_name} 數據抓取失敗：{e}")
        return f"{emoji} **{league_name}**：數據暫時無法取得。"

# ==========================================
# 中華職棒 (CPBL) 抓取邏輯
# ==========================================
def fetch_cpbl_scores() -> str:
    print("⚾ 正在抓取 CPBL 中華職棒最新賽果...")
    try:
        # 使用國際數據源介接 CPBL 比分
        url = "https://site.api.espn.com/apis/site/v2/sports/baseball/taiwan.1/scoreboard"
        resp = requests.get(url, timeout=15)
        if resp.status_code == 200:
            data = resp.json()
            events = data.get("events", [])
            if events:
                lines = ["🇹🇼 **CPBL 中華職棒今日賽果**"]
                for event in events:
                    status = event.get("status", {}).get("type", {}).get("shortDetail", "未開打")
                    competitors = event.get("competitions", [{}])[0].get("competitors", [])
                    if len(competitors) == 2:
                        home = competitors[0]
                        away = competitors[1]
                        lines.append(f"▸ {away.get('team', {}).get('displayName', '')} {away.get('score', '0')} vs {home.get('score', '0')} {home.get('team', {}).get('displayName', '')} [{status}]")
                return "\n".join(lines)
        
        return "🇹🇼 **CPBL 中華職棒**：今日無排定賽事或休兵日。"
    except Exception:
        return "🇹🇼 **CPBL 中華職棒**：賽事資料更新中。"

# ==========================================
# Telegram 推播
# ==========================================
def send_telegram_message(text: str):
    print("📲 發送五大體育聯賽賽果至 Telegram...")
    if not TELEGRAM_BOT_TOKEN or not TELEGRAM_CHAT_ID:
        raise ValueError("❌ 錯誤：Telegram 設定缺失！")
        
    url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
    payload = {
        'chat_id': TELEGRAM_CHAT_ID,
        'text': text,
        'parse_mode': 'Markdown'
    }
    
    resp = requests.post(url, data=payload, timeout=15)
    if resp.status_code != 200:
        payload.pop('parse_mode')
        requests.post(url, data=payload, timeout=15)

def main():
    print("🚀 開始執行全球體育戰績推播...")
    today_str = datetime.now(TW_TZ).strftime("%Y-%m-%d")
    
    # 1. 美籃 & 美棒
    nba_report = fetch_espn_league_scores("basketball", "nba", "NBA 籃球", "🏀")
    mlb_report = fetch_espn_league_scores("baseball", "mlb", "MLB 美棒", "⚾")
    
    # 2. 亞洲三大職棒 (中職、日棒、韓棒)
    cpbl_report = fetch_cpbl_scores()
    npb_report = fetch_espn_league_scores("baseball", "jpn.1", "NPB 日棒", "🇯🇵")
    kbo_report = fetch_espn_league_scores("baseball", "kor.1", "KBO 韓棒", "🇰🇷")
    
    full_report = (
        f"🏆 **【全球熱門體育戰績速報】({today_str})**\n"
        f"─" * 28 + "\n\n"
        f"{nba_report}\n\n"
        f"{mlb_report}\n\n"
        f"{cpbl_report}\n\n"
        f"{npb_report}\n\n"
        f"{kbo_report}\n\n"
        f"─" * 28
    )
    
    send_telegram_message(full_report)

if __name__ == "__main__":
    main()